[project]
name = "daily-neruwa"
version = "0.2.0"
description = "Collect Codex work evidence and update Obsidian daily reviews"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
