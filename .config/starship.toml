"$schema" = "https://starship.rs/config-schema.json"

add_newline = false
format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$python\
$conda\
$all\
$fill\
$cmd_duration\
$time\
$line_break\
$character"""

[os]
disabled = false
format = "[$symbol]($style)"

[username]
show_always = true
format = "[$user@]($style)"
style_user = "bold yellow"
style_root = "bold red"

[hostname]
ssh_only = false
trim_at = "."
format = "[$hostname ]($style)"
style = "bold green"

[directory]
truncation_length = 4
truncate_to_repo = false
read_only = " 󰌾"
format = "[$path$read_only]($style) "
style = "bold cyan"

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold purple"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "yellow"
conflicted = "=${count} "
deleted = "✘${count} "
renamed = "»${count} "
modified = "!${count} "
staged = "+${count} "
untracked = "?${count} "
stashed = '\$${count} '
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"

[python]
format = "[${symbol}${pyenv_prefix}(${version} )(\\($virtualenv\\) )]($style)"
style = "yellow"

[conda]
ignore_base = false
format = "[$symbol$environment]($style) "
style = "green"

[fill]
symbol = " "

[cmd_duration]
min_time = 1_000
format = "[took $duration]($style) "

[time]
disabled = false
time_format = "%H:%M"
format = "[$time]($style)"
style = "dimmed white"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
